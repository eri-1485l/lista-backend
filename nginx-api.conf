server {
    listen 8001;
    server_name _;

    server_tokens off;
    more_clear_headers Server;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_hide_header Server;
        proxy_set_header Server "";
    }
}